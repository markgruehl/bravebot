name: PR checks

# Checks for pull requests, including fork PRs and Renovate's branches. Everything here runs
# untrusted code (PR changes, and dependency code loaded by lint/test/build), so the jobs hold
# nothing worth stealing: read-only token, no secrets, no environments, no registry login or
# push, and no cache writes (PR-scoped caches couldn't reach main anyway). Fork PR runs also
# wait for maintainer approval (repo setting).
#
# Never switch this to pull_request_target, workflow_run or issue_comment, never reference
# secrets or an environment here, and never use self-hosted runners: this is a public repo.
# main.yaml re-runs the checks on the merged commit before anything is built or published.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # renovate: datasource=docker depName=node versioning=docker
  NODE_VERSION: 22.23.3
  # renovate: datasource=github-releases depName=docker/buildx
  BUILDX_VERSION: v0.37.2
  # renovate: datasource=docker depName=moby/buildkit
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # No `cache:` here, so nothing is saved from a PR run.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check lockfile sources
        run: .github/scripts/check-lockfile.sh
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker build (${{ matrix.arch.platform }})
    strategy:
      fail-fast: false
      matrix:
        arch:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
    env:
      PLATFORM: ${{ matrix.arch.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          # Default true would save the buildx binary to the Actions cache from a PR run.
          cache-binary: false

      # Reads main's build cache for speed; no cache-to, so PR builds never write a cache.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.arch.platform }}
          load: true
          tags: bravebot:pr
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Smoke test
        run: .github/scripts/smoke-test.sh bravebot:pr
